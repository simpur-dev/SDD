[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specweaver"
version = "0.1.0"
description = "SpecWeaver (规格织网): SDD engineering context runtime over seekdb and PowerContext"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SpecWeaver" }]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
seekdb = ["pyseekdb>=1.4"]
powercontext = ["httpx>=0.27"]
mcp = ["fastmcp>=2.2"]
cli = ["typer>=0.12", "rich>=13.7"]
server = ["uvicorn>=0.29"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "httpx>=0.27",
]

[project.scripts]
specweaver = "specweaver.adapters.driving.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specweaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires seekdb/powercontext containers",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
